# Add after docker-compose.ai.yml. Local OCR is opt-in; raw image inference remains off by default.
services:
  cv-ocr:
    build: ./deploy/ocr
    image: nexushr-local-ocr:1
    profiles: [ai]
    networks: [ai-internal]
    read_only: true
    tmpfs: ["/tmp:size=192m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  candidate-api:
    environment:
      LocalDocuments__Enabled: "true"
      LocalDocuments__BaseUrl: http://cv-ocr:8080
    depends_on:
      cv-ocr:
        condition: service_healthy
