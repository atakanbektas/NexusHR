services:
  candidate-db:
    image: postgres:16-alpine
    container_name: nexushr-candidate-db
    environment:
      POSTGRES_DB: nexushr_candidate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - candidate-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d nexushr_candidate
      interval: 5s
      timeout: 5s
      retries: 5

  candidate-storage:
    image: minio/minio:latest
    container_name: nexushr-candidate-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexushr
      MINIO_ROOT_PASSWORD: nexushr-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - candidate-storage-data:/data

volumes:
  candidate-db-data:
  candidate-storage-data: