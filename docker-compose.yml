services:
  candidate-db:
    image: postgres:16-alpine
    container_name: nexushr-candidate-db
    environment:
      POSTGRES_DB: nexushr_candidate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - candidate-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d nexushr_candidate
      interval: 5s
      timeout: 5s
      retries: 5

  hiring-db:
    image: postgres:16-alpine
    container_name: nexushr-hiring-db
    environment:
      POSTGRES_DB: nexushr_hiring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: nexushr
      RabbitMq__Password: nexushr-dev-secret
    ports:
      - "5435:5432"
    volumes:
      - hiring-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d nexushr_hiring
      interval: 5s
      timeout: 5s
      retries: 5

  identity-db:
    image: postgres:16-alpine
    container_name: nexushr-identity-db
    environment:
      POSTGRES_DB: nexushr_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d nexushr_identity
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: nexushr-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/nexushr_identity
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/nexushr-realm.json:/opt/keycloak/data/import/nexushr-realm.json:ro
    depends_on:
      identity-db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.3-management
    container_name: nexushr-rabbitmq
    hostname: nexushr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexushr
      RABBITMQ_DEFAULT_PASS: nexushr-dev-secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

  candidate-storage:
    image: minio/minio:latest
    container_name: nexushr-candidate-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexushr
      MINIO_ROOT_PASSWORD: nexushr-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - candidate-storage-data:/data

  candidate-api:
    build:
      context: .
      dockerfile: NexusHR.Candidate.Api/Dockerfile
    image: nexushr-candidate-api
    container_name: nexushr-candidate-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__CandidateDatabase: Host=candidate-db;Port=5432;Database=nexushr_candidate;Username=postgres;Password=postgres

      Minio__Endpoint: candidate-storage:9000
      Minio__AccessKey: nexushr
      Minio__SecretKey: nexushr-dev-secret
      Minio__BucketName: candidate-documents
      Minio__UseSsl: "false"

      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: nexushr
      RabbitMq__Password: nexushr-dev-secret

      Keycloak__Authority: http://localhost:8080/realms/nexushr
      Keycloak__MetadataAddress: http://keycloak:8080/realms/nexushr/.well-known/openid-configuration
      Keycloak__ClientId: nexushr-web
      Keycloak__RequireHttpsMetadata: "false"
    ports:
      - "5211:8080"
    depends_on:
      candidate-db:
        condition: service_healthy
      candidate-storage:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  hiring-api:
    build:
      context: .
      dockerfile: NexusHR.Hiring.Api/Dockerfile
    image: nexushr-hiring-api
    container_name: nexushr-hiring-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__HiringDatabase: Host=hiring-db;Port=5432;Database=nexushr_hiring;Username=postgres;Password=postgres

      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: nexushr
      RabbitMq__Password: nexushr-dev-secret

      Keycloak__Authority: http://localhost:8080/realms/nexushr
      Keycloak__MetadataAddress: http://keycloak:8080/realms/nexushr/.well-known/openid-configuration
      Keycloak__ClientId: nexushr-web
      Keycloak__RequireHttpsMetadata: "false"
    ports:
      - "5221:8080"
    depends_on:
      hiring-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexushr-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  notification-api:
    build:
      context: .
      dockerfile: NexusHR.Notification.Api/Dockerfile
    image: nexushr-notification-api
    container_name: nexushr-notification-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: nexushr
      RabbitMq__Password: nexushr-dev-secret

      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__SenderEmail: hr@nexushr.local
      Smtp__SenderName: NexusHR İnsan Kaynakları
      Smtp__UseSsl: "false"

      OfferResponse__PublicWebUrl: http://localhost:5173
    ports:
      - "5231:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: NexusHR.Gateway/Dockerfile
    image: nexushr-gateway
    container_name: nexushr-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__hiring-cluster__Destinations__hiring-api__Address: http://hiring-api:8080/

      ReverseProxy__Clusters__candidate-cluster__Destinations__candidate-api__Address: http://candidate-api:8080/

      Keycloak__Authority: http://localhost:8080/realms/nexushr
      Keycloak__MetadataAddress: http://keycloak:8080/realms/nexushr/.well-known/openid-configuration
      Keycloak__ClientId: nexushr-web
      Keycloak__RequireHttpsMetadata: "false"
    ports:
      - "5000:8080"
    depends_on:
      candidate-api:
        condition: service_started
      hiring-api:
        condition: service_started
      keycloak:
        condition: service_started

  candidate-web:
    build:
      context: ./NexusHR.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: nexushr
        VITE_KEYCLOAK_CLIENT_ID: nexushr-web
    image: nexushr-candidate-web
    container_name: nexushr-candidate-web
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  candidate-db-data:
  hiring-db-data:
  identity-db-data:
  candidate-storage-data:
  rabbitmq-data: