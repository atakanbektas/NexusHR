# Opt-in local AI. No host Ollama/Python/CUDA installation and no published Ollama port.
services:
  ollama-model-init:
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    profiles: [ai]
    entrypoint: [/bin/sh, /bootstrap/init-model.sh]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
      - ./deploy/ollama/init-model.sh:/bootstrap/init-model.sh:ro
    # Only this short-lived bootstrap has Internet access, for model download.
    networks: [default]
    mem_limit: 2g
    cpus: 2
    restart: "no"

  ollama:
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    profiles: [ai]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      ai-internal:
        aliases: [nexushr-local-ai]
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    mem_limit: 8g
    cpus: 6
    restart: unless-stopped

  candidate-api:
    environment:
      CvAnalysis__Enabled: "true"
      CvAnalysis__Provider: Ollama
      CvAnalysis__Model: ${OLLAMA_MODEL:-qwen3:4b}
      CvAnalysis__AllowExternalProcessing: "false"
      CvAnalysis__TimeoutSeconds: "240"
      CvAnalysis__MaxParallelCalls: "1"
      CvAnalysis__MaxOutputTokens: "4000"
      CvAnalysis__Ollama__BaseUrl: http://nexushr-local-ai:11434
    networks: [default, ai-internal]
    depends_on:
      ollama:
        condition: service_healthy

networks:
  ai-internal:
    internal: true

volumes:
  ollama-models:
