# Opt-in development observability. Never changes or reinitializes business volumes.
services:
  engineering-db:
    image: postgres:16-alpine
    profiles: [engineering]
    environment:
      POSTGRES_DB: nexushr_engineering
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: ${ENGINEERING_DB_PASSWORD:?Generate a private engineering env file}
    volumes: [engineering-db-data:/var/lib/postgresql/data]
    networks: [engineering]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U engineering -d nexushr_engineering']
      interval: 5s
      timeout: 3s
      retries: 20
  engineering-permissions:
    image: busybox:1.37.0
    profiles: [engineering]
    network_mode: none
    command: [sh, -c, 'chown -R 10001:10001 /tempo /loki']
    volumes: [engineering-tempo-data:/tempo, engineering-loki-data:/loki]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    mem_limit: 32m
    restart: 'no'
  engineering-collector:
    image: otel/opentelemetry-collector-contrib@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    profiles: [engineering]
    command: ['--config=/etc/otelcol.yml']
    volumes: [./deploy/engineering/collector.yml:/etc/otelcol.yml:ro]
    networks: [default, engineering]
    mem_limit: 256m
    depends_on: [engineering-tempo, engineering-loki]
  engineering-prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [engineering]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=24h', '--storage.tsdb.retention.size=512MB']
    volumes: [./deploy/engineering/prometheus.yml:/etc/prometheus/prometheus.yml:ro, engineering-prometheus-data:/prometheus]
    networks: [engineering]
    mem_limit: 384m
  engineering-tempo:
    image: grafana/tempo@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: [engineering]
    command: ['-config.file=/etc/tempo.yml']
    volumes: [./deploy/engineering/tempo.yml:/etc/tempo.yml:ro, engineering-tempo-data:/var/tempo]
    networks: [engineering]
    mem_limit: 512m
    depends_on:
      engineering-permissions: { condition: service_completed_successfully }
  engineering-loki:
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: [engineering]
    command: ['-config.file=/etc/loki.yml']
    volumes: [./deploy/engineering/loki.yml:/etc/loki.yml:ro, engineering-loki-data:/loki]
    networks: [engineering]
    mem_limit: 512m
    depends_on:
      engineering-permissions: { condition: service_completed_successfully }
  engineering-grafana:
    image: grafana/grafana@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [engineering]
    environment:
      GF_SECURITY_ADMIN_USER: engineering
      GF_SECURITY_ADMIN_PASSWORD: ${ENGINEERING_GRAFANA_PASSWORD:?Generate a private engineering env file}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports: [127.0.0.1:3000:3000]
    volumes: [./deploy/engineering/grafana:/etc/grafana/provisioning/datasources:ro, ./deploy/engineering/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro, ./deploy/engineering/dashboards:/var/lib/grafana/dashboards:ro, engineering-grafana-data:/var/lib/grafana]
    # Docker does not publish ports for a container attached only to internal networks.
    # The UI bridge contains Grafana only; telemetry sources remain private.
    networks: [engineering, engineering-ui]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
  # This exporter has host visibility. Enable only on a trusted development machine.
  # A read-only socket mount does NOT make Docker's API read-only. No app/agent shares it.
  engineering-cadvisor:
    image: ghcr.io/google/cadvisor@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [engineering]
    privileged: true
    command: ['--docker_only=true', '--housekeeping_interval=10s', '--store_container_labels=true']
    volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker:/var/lib/docker:ro']
    networks: [engineering]
    mem_limit: 256m
  engineering-node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [engineering]
    pid: host
    command: ['--path.rootfs=/host']
    volumes: ['/:/host:ro']
    networks: [engineering]
    mem_limit: 64m
  gateway:
    env_file: ['${ENGINEERING_ENV_FILE:?Path to private engineering env file}']
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://engineering-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
    networks: [default, engineering]
    depends_on:
      engineering-db: { condition: service_healthy }
  candidate-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://engineering-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
  hiring-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://engineering-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
  onboarding-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://engineering-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
  notification-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://engineering-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
networks:
  engineering-ui: {}
  engineering: { internal: true }
volumes:
  engineering-db-data:
  engineering-tempo-data:
  engineering-loki-data:
  engineering-prometheus-data:
  engineering-grafana-data:
