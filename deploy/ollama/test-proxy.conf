server {
    listen 8080;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ ^/api/(version|tags|show|chat)$ {
        set $local_ollama http://nexushr-local-ai:11434;
        proxy_pass $local_ollama;
        proxy_read_timeout 650s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location / { return 404; }
}
