apiVersion: 1
datasources:
  - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: 'http://engineering-prometheus:9090', isDefault: true }
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://engineering-tempo:3200
    jsonData:
      tracesToLogsV2: { datasourceUid: loki, spanStartTimeShift: '-1m', spanEndTimeShift: '1m', filterByTraceID: true }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://engineering-loki:3100
    jsonData:
      derivedFields:
        - { name: TraceID, matcherType: label, matcherRegex: trace_id, datasourceUid: tempo, url: '$${__value.raw}' }
