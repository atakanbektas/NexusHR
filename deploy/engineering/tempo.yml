target: all
server: { http_listen_port: 3200 }
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: '0.0.0.0:4317' }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/blocks }
    wal: { path: /var/tempo/wal }
backend_scheduler:
  provider:
    compaction:
      compaction: { block_retention: 24h }
backend_worker:
  compaction: { block_retention: 24h }
usage_report: { reporting_enabled: false }
