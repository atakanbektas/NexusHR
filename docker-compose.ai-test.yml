# Explicit developer-only loopback access for the opt-in real-model test suite.
services:
  ollama-test-proxy:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    profiles: [ai]
    ports:
      - "127.0.0.1:${OLLAMA_TEST_PORT:-11435}:8080"
    volumes:
      - ./deploy/ollama/test-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, ai-internal]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/version']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    cpus: 0.5
