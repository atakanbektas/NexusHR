# Optional planned local restart for query statistics. Existing named volumes remain attached.
services:
  candidate-db:
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements]
  hiring-db:
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements]
  onboarding-db:
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements]
