name: Publish reviewed containers
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        description: Protected environment supplying public build settings
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    # Publishing is explicit and restricted to reviewed main; no automatic deployment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        service: [Candidate, Hiring, Onboarding, Notification, Gateway, Web]
    steps:
      - uses: actions/checkout@v5
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=completed" > ci-runs.json
          jq -e --arg sha "$GITHUB_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' ci-runs.json
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit tag
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          name="${SERVICE,,}"
          project="NexusHR.$SERVICE.Api"
          if [ "$SERVICE" = Gateway ]; then project=NexusHR.Gateway; fi
          if [ "$SERVICE" = Web ]; then
            test -n "$PUBLIC_API_URL" && test -n "$KEYCLOAK_URL" && test -n "$KEYCLOAK_REALM" && test -n "$KEYCLOAK_CLIENT_ID"
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "ghcr.io/$repo-$name:$GITHUB_SHA" \
              --build-arg VITE_API_BASE_URL="$PUBLIC_API_URL" --build-arg VITE_KEYCLOAK_URL="$KEYCLOAK_URL" \
              --build-arg VITE_KEYCLOAK_REALM="$KEYCLOAK_REALM" --build-arg VITE_KEYCLOAK_CLIENT_ID="$KEYCLOAK_CLIENT_ID" NexusHR.Web
          else
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f "$project/Dockerfile" -t "ghcr.io/$repo-$name:$GITHUB_SHA" .
          fi
          digest="$(docker push --quiet "ghcr.io/$repo-$name:$GITHUB_SHA")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg service "$SERVICE" --arg sha "$GITHUB_SHA" --arg image "ghcr.io/$repo-$name@$digest" '{service:$service,revision:$sha,image:$image}' > "release-$name.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.service }}-${{ github.sha }}
          path: release-*.json
          retention-days: 30
